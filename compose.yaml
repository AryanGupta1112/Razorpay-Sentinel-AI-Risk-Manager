services:
  sentinel-postgres:
    image: postgres:17
    container_name: sentinel-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
    volumes:
      - sentinel_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  sentinel-redis:
    image: redis:8-alpine
    container_name: sentinel-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - sentinel_redis_data:/data
    restart: unless-stopped

  sentinel-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinel-backend
    depends_on:
      - sentinel-postgres
      - sentinel-redis
    ports:
      - "8000:8000"
    environment:
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: "127.0.0.1,localhost,sentinel-backend"
      DATABASE_URL: "postgresql://sentinel:sentinel@sentinel-postgres:5432/sentinel"
      REDIS_URL: "redis://sentinel-redis:6379/1"
      DJANGO_EMAIL_HOST: "smtp.gmail.com"
      DJANGO_EMAIL_PORT: "587"
      DJANGO_EMAIL_USE_TLS: "true"
      DJANGO_EMAIL_HOST_USER: "${DJANGO_EMAIL_HOST_USER:-}"
      DJANGO_EMAIL_HOST_PASSWORD: "${DJANGO_EMAIL_HOST_PASSWORD:-}"
      DJANGO_EMAIL_FROM: "${DJANGO_EMAIL_FROM:-}"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:-sentinel-dev-secret-key}"
      DJANGO_AUTH_TOKEN_TTL_HOURS: "${DJANGO_AUTH_TOKEN_TTL_HOURS:-168}"
      DJANGO_AUTH_CODE_TTL_MINUTES: "${DJANGO_AUTH_CODE_TTL_MINUTES:-30}"
      AUTH_REQUIRE_VERIFICATION_FOR_NON_ADMINS: "${AUTH_REQUIRE_VERIFICATION_FOR_NON_ADMINS:-true}"
      AUTH_EXPOSE_CODES: "${AUTH_EXPOSE_CODES:-false}"
    restart: unless-stopped

volumes:
  sentinel_postgres_data:
  sentinel_redis_data:
